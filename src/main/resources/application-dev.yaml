spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

server:
  port: 8081

corely:
  seed:
    enabled: true

# Apenas desenvolvimento local. Em producao o segredo vem de JWT_SECRET
# (application.yaml resolve ${JWT_SECRET} sem default, falhando se ausente).
jwt:
  secret: ${JWT_SECRET:dev-only-secret-not-for-production-corely}
  previous-secrets: ${JWT_PREVIOUS_SECRETS:}
