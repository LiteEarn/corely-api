spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    out-of-order: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

corely:
  seed:
    enabled: false
  scheduler:
    session-generation-days: 90
  makeup:
    expiration-days: 30
  swagger:
    enabled: false

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.springframework.web: INFO

jwt:
  secret: ${JWT_SECRET}
  previous-secrets: ${JWT_PREVIOUS_SECRETS:}
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

server:
  error:
    include-stacktrace: never
