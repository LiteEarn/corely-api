spring:
  application:
    name: corely-api
  datasource:
    url: jdbc:postgresql://localhost:5432/corely?currentSchema=corely
    username: corely
    password: corely
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    out-of-order: true

corely:
  scheduler:
    session-generation-days: 90
  makeup:
    expiration-days: 30

jwt:
  secret: ${JWT_SECRET}
  previous-secrets: ${JWT_PREVIOUS_SECRETS:}
  access-token-expiration: 900000
  refresh-token-expiration: 604800000
