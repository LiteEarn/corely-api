spring:
  application:
    name: corely-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/corely?currentSchema=corely}
    username: ${DATABASE_USERNAME:corely}
    password: ${DATABASE_PASSWORD:corely}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    out-of-order: true

corely:
  scheduler:
    session-generation-days: 90
  makeup:
    expiration-days: 30
  swagger:
    enabled: true
  rate-limit:
    enabled: true
    requests-per-window: 100
    window-seconds: 60
    sensitive-paths:
      - /auth/**
    sensitive-requests-per-window: 5
  login-lockout:
    enabled: true
    max-attempts: 5
    lockout-seconds: 900
  cors:
    allowed-origins:
      - http://localhost:4200

jwt:
  secret: ${JWT_SECRET}
  previous-secrets: ${JWT_PREVIOUS_SECRETS:}
  access-token-expiration: 900000
  refresh-token-expiration: 604800000
